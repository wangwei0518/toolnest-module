name: Validate ToolNest modules

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and package modules
        run: pnpm package:all

      - name: Test bundle budget validation
        run: node --test test/module-budgets.test.mjs

      - name: Test temporary transfer storage and access
        run: pnpm --dir modules/temporary-transfer/backend exec node --import tsx --test test/transfer.test.ts test/local-transfer.test.ts ../frontend/test/errors.test.ts

      - name: Validate module bundle budgets
        run: pnpm budget:check
