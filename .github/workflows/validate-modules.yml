name: Validate ToolNest modules

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: module-tests
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: modules/anime-calendar-react/backend-go/go.mod
          cache-dependency-path: |
            modules/anime-calendar-react/backend-go/go.sum
            modules/temporary-transfer/backend-go/go.sum
            modules/workflow-tickets-react/backend-go/go.sum
            modules/xiaomi-rear-wallpaper/backend-go/go.sum
            modules/python-runner-react/backend-go/go.sum

      - name: Test anime calendar Go backend
        working-directory: modules/anime-calendar-react/backend-go
        env:
          ANIME_TEST_DATABASE_URL: postgres://postgres:module-tests@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?sslmode=disable
        run: go test -race ./... && go vet ./...

      - name: Build and package modules
        run: pnpm package:all

      - name: Test workflow tickets Go backend
        working-directory: modules/workflow-tickets-react/backend-go
        env:
          TOOLNEST_WORKFLOW_TEST_DATABASE_URL: postgres://postgres:module-tests@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?sslmode=disable
        run: go test -race ./... && go vet ./...

      - name: Test bundle budget validation
        run: node --test test/module-budgets.test.mjs

      - name: Test temporary transfer storage and access
        run: |
          go -C modules/temporary-transfer/backend-go test -race ./...
          go -C modules/temporary-transfer/backend-go vet ./...
          node --experimental-strip-types --test modules/temporary-transfer/frontend/test/errors.test.ts

      - name: Test wallpaper Go backend
        working-directory: modules/xiaomi-rear-wallpaper/backend-go
        run: go test -tags nodynamic -race ./... && go vet -tags nodynamic ./...

      - name: Test Python Runner Go backend
        working-directory: modules/python-runner-react/backend-go
        env:
          PYTHON_RUNNER_TEST_DATABASE_URL: postgres://postgres:module-tests@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?sslmode=disable
        run: go test -race ./... && go vet ./...

      - name: Validate module bundle budgets
        run: pnpm budget:check
